apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "devsecops-demo-app.fullname" . }}
spec:
  replicas: 2

  selector:
    matchLabels:
      app: devsecops-demo-app

  template:
    metadata:
      labels:
        app: devsecops-demo-app
    spec:
      containers:
        - name: devsecops-demo-app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 3000

  strategy:
    canary:
      steps:
        - setWeight: 20
        - pause:
            duration: 30s
        - setWeight: 50
        - pause:
            duration: 30s
